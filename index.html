<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Buddy</title>
<style>
:root{--bg:#faf8f5;--surface:#fff;--text:#1f1d1a;--muted:#6b665e;--accent:#c4552d;--on-accent:#fff;--border:#e4dfd7;--user:#f3e8dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--surface:#211e1b;--text:#f0ece6;--muted:#a39d93;--accent:#e0714a;--on-accent:#1a1210;--border:#34302b;--user:#33291f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--surface:#211e1b;--text:#f0ece6;--muted:#a39d93;--accent:#e0714a;--on-accent:#1a1210;--border:#34302b;--user:#33291f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{padding:16px 16px 8px}
h1{font:600 20px/1.2 Georgia,"Times New Roman",serif;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.modes{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.modes button{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--border)}
.msg.user{align-self:flex-end;background:var(--user)}
.msg.bot{align-self:flex-start;background:var(--surface)}
.msg.err{color:var(--muted);font-style:italic}
.hint{color:var(--muted);text-align:center;margin:auto;padding:24px;font-size:15px}
.hint button{display:block;margin:8px auto 0;border:1px dashed var(--border);background:none;color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
form{display:flex;gap:8px;padding:12px 16px}
textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;max-height:140px}
#go{border:0;background:var(--accent);color:var(--on-accent);padding:0 18px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
#go:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Study Buddy</h1>
  <p>Ask a question, paste your notes, or pick a mode below.</p>
</header>
<div class="modes" id="modes"></div>
<div id="log"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Type a question or paste notes…" aria-label="Message"></textarea>
  <button id="go" type="submit">Send</button>
</form>
<script>
const MODES = {
  explain: {label: "Explain", hint: "Try a topic you’re stuck on:", ex: "Explain how photosynthesis works",
    sys: "You are a patient tutor. Explain the topic clearly in plain language, build from basics, use one concrete example or analogy, and end with one short check-your-understanding question."},
  quiz: {label: "Quiz me", hint: "Name a topic or paste notes:", ex: "Quiz me on the causes of World War I",
    sys: "You are a quiz master. Ask ONE question at a time about the topic or notes given. After the student answers, say whether it is right, explain briefly, then ask the next question. Increase difficulty as they succeed."},
  summarize: {label: "Summarize", hint: "Paste text or notes to condense:", ex: "Summarize the key ideas of supply and demand",
    sys: "You summarize study material. Give a short summary (3–5 sentences), then the key terms with one-line definitions, then 3 likely exam questions."},
  research: {label: "Research", hint: "Describe your research question:", ex: "Help me plan a paper on social media and teen sleep",
    sys: "You are a research coach. Help narrow the question, suggest a search strategy and keywords, outline an approach, and point out common pitfalls. Do not invent citations; if you mention sources, say they should be verified."}
};
let mode = "explain", history = [], busy = false, sample = null;
const $ = id => document.getElementById(id), log = $("log"), t = $("t"), go = $("go");

function renderModes(){
  $("modes").innerHTML = "";
  for (const k in MODES){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = MODES[k].label;
    b.setAttribute("aria-pressed", k === mode);
    b.onclick = () => { mode = k; history = []; renderModes(); empty(); };
    $("modes").appendChild(b);
  }
}
function empty(){
  log.innerHTML = "";
  const m = MODES[mode], d = document.createElement("div");
  d.className = "hint"; d.textContent = m.hint;
  const b = document.createElement("button");
  b.type = "button"; b.textContent = m.ex;
  b.onclick = () => { t.value = m.ex; send(); };
  d.appendChild(b); log.appendChild(d);
}
function bubble(cls, text){
  const h = log.querySelector(".hint"); if (h) h.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
async function send(){
  const text = t.value.trim();
  if (!text || busy) return;
  if (!sample) { try { sample = await claude.use("sample"); } catch (e) { sample = null; } }
  if (!sample) { bubble("bot err", "The assistant isn’t available in this view. Open the page from your Claude account to use it."); return; }
  busy = true; go.disabled = true; t.value = "";
  history.push({role: "user", content: text});
  bubble("user", text);
  const out = bubble("bot", "Thinking…");
  const msgs = history.map((m, i) => i === 0
    ? {role: "user", content: MODES[mode].sys + "\n\nStudent’s first message:\n" + m.content}
    : m);
  try {
    const r = await sample(msgs, {cache: false, onText: ({text}) => { out.textContent = text; log.scrollTop = log.scrollHeight; }});
    out.textContent = r.text;
    history.push({role: "assistant", content: r.text});
  } catch (e) {
    history.pop();
    out.className = "msg bot err";
    out.textContent = e && e.code === "rate_limited" ? "Too many requests. Wait a moment and try again."
      : e && e.code === "not_granted" ? "Permission was declined, so I can’t answer."
      : "Something went wrong. Please try again.";
  }
  busy = false; go.disabled = false; t.focus();
}
$("f").addEventListener("submit", e => { e.preventDefault(); send(); });
t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
renderModes(); empty();
</script>
</body>
</html>
